[project]
name = "servicenow-mcp"
version = "0.1.0"
description = "MCP server exposing ServiceNow CMDB/CI operations as tools"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0,<2.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/servicenow_mcp"]

[project.scripts]
servicenow-mcp = "servicenow_mcp.server:main"
